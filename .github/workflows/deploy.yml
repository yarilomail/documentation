name: Deploy docs

on:
  push:
    branches: [main]
    # Release tags only; v2.4.5-dev.4 does not match.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# gh-pages holds every published version; a run rebuilds only its own.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.register.outputs.latest }}
      artifact_id: ${{ steps.pages.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated reads each page's last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "DOCS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" = main ]; then
            echo "DOCS_VERSION=main" >> "$GITHUB_ENV"
          else
            echo "::error::run from main or a release tag, not $GITHUB_REF_NAME"; exit 1
          fi
      - name: Check out the published site
        run: |
          if git fetch origin gh-pages; then
            git worktree add --detach site FETCH_HEAD
          else
            git worktree add --detach site
            git -C site rm -rfq .
          fi
      - name: Build ${{ env.DOCS_VERSION }}
        run: |
          npm run docs:build
          rm -rf "site/${DOCS_VERSION:?}"
          cp -R .vitepress/dist "site/$DOCS_VERSION"
      - id: register
        run: echo "latest=$(node scripts/site-root.mjs register site "$DOCS_VERSION")" >> "$GITHUB_OUTPUT"
      - name: Build latest
        if: steps.register.outputs.latest == 'true'
        env:
          DOCS_VERSION: latest
        run: |
          npm run docs:build
          rm -rf site/latest
          cp -R .vitepress/dist site/latest
      - run: node scripts/site-root.mjs root site
      - name: Commit the published site
        # Build output: one orphan commit, so the fetch stays small.
        run: |
          cd site
          git checkout -q --orphan publish
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Publish $DOCS_VERSION from ${GITHUB_SHA::7}"
          git push -f origin HEAD:gh-pages
      - uses: actions/configure-pages@v5
      - id: pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages keeps the first deployment of a version, and a release tag sits on the
      # commit main already deployed: each run deploys under a version of its own.
      - id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          auth() { printf 'Authorization: Bearer %s\n' "$1"; }
          api() {
            curl -sS --fail-with-body -H @<(auth "$GH_TOKEN") \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$@"
          }
          OIDC_TOKEN=$(curl -sS --fail -H @<(auth "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er .value)
          echo "::add-mask::$OIDC_TOKEN"
          export OIDC_TOKEN
          DEPLOYMENT=$(jq -nc --argjson a "$ARTIFACT_ID" \
            '{artifact_id: $a, pages_build_version: env.VERSION, oidc_token: env.OIDC_TOKEN}' |
            api -X POST --data @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments")
          ID=$(jq -er .id <<<"$DEPLOYMENT")
          echo "page_url=$(jq -er .page_url <<<"$DEPLOYMENT")" >> "$GITHUB_OUTPUT"
          for _ in $(seq 120); do
            STATUS=$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments/$ID" | jq -r .status)
            case "$STATUS" in
              succeed) echo "Deployed $VERSION"; exit 0 ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment $VERSION: $STATUS"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Pages deployment $VERSION still $STATUS after 10 minutes"; exit 1

  indexnow:
    needs: [build, deploy]
    # Only `latest` is in the sitemap, so only its rebuild is news.
    if: needs.build.outputs.latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          SITE="https://doc.yarilomail.org"
          KEY="2d4ef23e415848c4aeee9fc1d84ce7c6"

          # Wait until Pages serves the new build, then ping the sitemap URLs.
          for i in $(seq 1 20); do
            curl -sf "${SITE}/${KEY}.txt" | grep -qx "${KEY}" && break
            sleep 15
          done
          URLS=$(curl -sf "${SITE}/sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed 's|<loc>\(.*\)</loc>|"\1"|' \
            | paste -sd, -)
          if [ -z "$URLS" ]; then
            echo "Failed to fetch sitemap URLs (non-fatal)"; exit 0
          fi
          echo "Pinging IndexNow with $(echo "$URLS" | grep -o 'https' | wc -l) URLs"
          curl -sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"doc.yarilomail.org\",\"key\":\"${KEY}\",\"keyLocation\":\"${SITE}/${KEY}.txt\",\"urlList\":[${URLS}]}" \
            && echo "IndexNow notified" || echo "IndexNow ping failed (non-fatal)"
