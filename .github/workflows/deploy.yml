name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          SITE="https://doc.yarilomail.org"
          KEY="2d4ef23e415848c4aeee9fc1d84ce7c6"

          # Pages may take a moment to serve the new build; wait for the key
          # file, then take the URL list from the freshly deployed sitemap so
          # it never drifts from the site.
          for i in $(seq 1 20); do
            curl -sf "${SITE}/${KEY}.txt" | grep -qx "${KEY}" && break
            sleep 15
          done
          URLS=$(curl -sf "${SITE}/sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed 's|<loc>\(.*\)</loc>|"\1"|' \
            | paste -sd, -)
          if [ -z "$URLS" ]; then
            echo "Failed to fetch sitemap URLs (non-fatal)"; exit 0
          fi
          echo "Pinging IndexNow with $(echo "$URLS" | grep -o 'https' | wc -l) URLs"
          curl -sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"doc.yarilomail.org\",\"key\":\"${KEY}\",\"keyLocation\":\"${SITE}/${KEY}.txt\",\"urlList\":[${URLS}]}" \
            && echo "IndexNow notified" || echo "IndexNow ping failed (non-fatal)"
