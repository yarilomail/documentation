# The site is the gh-pages branch, which the Deploy docs workflow rewrites on
# every merge and release tag; a sidecar pulls it and nginx serves it.
site:
  repo: https://github.com/yarilomail/documentation.git
  branch: gh-pages
  # Seconds between pulls; a new commit shows within this.
  pullIntervalSeconds: 60
  # The emptyDir holds up to three checkouts at once: the previous, the current
  # and the one being cloned. Peak = 3 x the shallow clone of gh-pages, which
  # was 70 MB with 2.4.5, 2.4.6, main and latest and grows by about 16 MB a
  # released version (so about 48 MB here). Over the limit kubelet evicts the
  # pod; 1Gi holds about 18 more releases.
  sizeLimit: 1Gi

image:
  nginx: nginx:1.28-alpine
  sync: alpine:3.24
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "public"
  host: doc.yarilomail.org
  tls: true
  certIssuer: letsencrypt-prod
  tlsSecretName: ""   # defaults to "<fullname>-tls"

# Restrict origin access to Cloudflare edge IPs (the site is Cloudflare-proxied).
# ipRanges is the starting list. The Ingress carries the label
# cloudflare-whitelist, so the cluster's one cf-whitelist CronJob rewrites the annotation from api.cloudflare.com every 6 hours;
# ArgoCD ignores that annotation.
cloudflareWhitelist:
  enabled: true
  ipRanges: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

# Where requests reach nginx from: the ingress controller (pod network, or the
# node when it runs on the host network). CF-Connecting-IP from these is the
# client's address in the log; from anywhere else it is ignored.
realIp:
  trustedProxies:
    - 10.0.0.0/8

resources:
  nginx:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}
  sync:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

nodeSelector: {}
tolerations: []
affinity: {}
