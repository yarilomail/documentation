# Every documented yarilo.yaml setting, keyed by its full path.
# Field reference: CLAUDE.md, "Settings".

hostname:
  type: string
  default_text: the host's own name (`os.Hostname()`)
  description: |
    The name yarilo answers with and stamps into mail. It sits at the top
    level of `yarilo.yaml`, not inside `general:`, because more than one
    section reads it.

chart_version:
  type: string
  default: ""
  advanced: true
  description: |
    Written by the Helm chart, never by an operator. A process compares it with
    the chart version it was built from and warns at start when they differ.

general.ssl.ssl_server_cert_file:
  type: string
  default: ""
  aliases: [tls_cert]
  see_also: [general.ssl.ssl_server_key_file]
  description: |
    Path to the PEM certificate, or the full chain. `${ENV_VAR}` is expanded at
    startup.

general.ssl.ssl_server_key_file:
  type: string
  default: ""
  aliases: [tls_key]
  see_also: [general.ssl.ssl_server_cert_file]
  description: |
    Path to the PEM private key that matches `ssl_server_cert_file`.

general.ssl.ssl_server_alt_cert_file:
  type: string
  default: ""
  aliases: [tls_alt_cert]
  see_also: [general.ssl.ssl_server_alt_key_file]
  description: |
    Optional second certificate, for example ECDSA beside RSA, chosen per
    client by SNI.

general.ssl.ssl_server_alt_key_file:
  type: string
  default: ""
  aliases: [tls_alt_key]
  see_also: [general.ssl.ssl_server_alt_cert_file]
  description: |
    Private key for `ssl_server_alt_cert_file`.

general.ssl.ssl_min_protocol:
  type: string
  default: TLS1.2
  values: [TLS1.2, TLS1.3]
  aliases: [tls_min_version]
  description: |
    Minimum TLS version a client may negotiate.

general.ssl.ssl_prefer_server_ciphers:
  type: boolean
  default: false
  aliases: [prefer_server_ciphers]
  description: |
    Use the server's cipher-suite preference order instead of the client's.

general.haproxy.timeout:
  type: integer
  unit: seconds
  default: 3
  description: |
    Time to wait for the PROXY header. The connection is closed when it does
    not arrive in time.

general.haproxy.haproxy_trusted_networks:
  type: list
  default: [127.0.0.1/32, 10.0.0.0/8]
  aliases: [trusted_nets]
  description: |
    CIDRs whose PROXY headers are accepted. A connection from anywhere else
    keeps its TCP source address.

general.xclient.trusted_nets:
  type: list
  default: []
  changed:
    - version: 2.4.4
      text: The default was `127.0.0.1/32, 10.0.0.0/8`; it now trusts nobody.
  description: |
    CIDRs of the proxies and relays allowed to issue XCLIENT. Empty trusts
    none.

general.limits.mail_max_userip_connections:
  type: integer
  default: 10
  description: |
    Simultaneous connections per user and IP pair, counted across all IMAP and
    POP3 listeners. `0` is unlimited. A userdb field of the same name overrides
    it per user.

general.startup_dial_retries:
  type: integer
  default: 3
  description: |
    Attempts to reach an external dependency, such as warden or Redis, at
    startup before the process gives up.

login.login_proxy_timeout:
  type: integer
  unit: seconds
  default: 30
  helm: login.login_proxy_timeout
  description: |
    Time a login proxy may spend reaching the user's backend and bringing the
    session up there: the connect, re-routes to another backend, the preamble
    and the backend's greeting, with every retry inside the same window. Past
    it the client gets a temporary failure (`NO [UNAVAILABLE]` on IMAP) and may
    log in again. A user's `proxy_timeout` (see [Authentication](/auth/))
    replaces it.

login.transient_retries:
  type: integer
  default: 3
  helm: login.transientRetries
  see_also: [login.transient_relogin_cap]
  description: |
    Extra attempts a transient failure gets (auth temporary failure, auth dial,
    backend session setup) before the client is told the service is
    unavailable. `0` fails on the first error.

login.transient_relogin_cap:
  type: integer
  default: 3
  helm: login.transientReloginCap
  see_also: [login.transient_retries]
  description: |
    Once the retries are spent, the proxy answers `NO [UNAVAILABLE]` and keeps
    the connection open for another login. This many such answers close the
    connection. Independent of `auth_max_attempts`. `0` closes on the first.

auth_service.auth_startup_wait:
  type: integer
  unit: seconds
  default: 30
  helm: components.auth.startup_wait
  description: |
    Time to wait for yarilo-auth at startup. `0` does not wait.

locks_client.locks_client_startup_wait:
  type: integer
  unit: seconds
  default: 30
  helm: components.locks.client.startup_wait
  description: |
    Time to wait for yarilo-locks at startup. `0` does not wait.

auth_client.auth_client_pool_size:
  type: integer
  default: 4
  helm: components.auth.client.pool_size
  description: |
    Connections to yarilo-auth kept open for userdb lookups. `0` dials per
    lookup. On shutdown each connection still serving a lookup is waited for
    up to a second.

auth_client.auth_client_pool_idle_timeout:
  type: integer
  unit: seconds
  default: 300
  helm: components.auth.client.pool_idle_timeout
  description: |
    Time an unused pooled connection is kept. `0` never closes one for
    idleness.

internal_tls.session_cache_size:
  type: integer
  default: 64
  helm: internalTLS.sessionCacheSize
  description: |
    TLS sessions an internal client keeps for resumption. `0` turns resumption
    off.

internal_tls.session_cache_ttl:
  type: integer
  unit: seconds
  default: 0
  helm: internalTLS.sessionCacheTtl
  description: |
    Time a cached session may be resumed. `0` keeps it until the cache evicts
    it.

director_service.backend_expire:
  type: integer
  unit: seconds
  default: 30
  helm: components.director.backend_expire
  see_also: [backend_register.register_interval]
  description: |
    Missed heartbeats for this long remove a backend from the ring on every
    director, and its users are rehashed onto the other backends of its tag.

backend_register.director_addr:
  type: string
  default: ""
  helm: backend_register.director_addr
  description: |
    The director Service the registration sidecar sends `BACKEND-UP` to. Any
    replica may answer: the registration is spread around the ring.

backend_register.register_interval:
  type: integer
  unit: seconds
  default: 10
  helm: backend_register.register_interval
  see_also: [director_service.backend_expire]
  description: |
    How often the sidecar re-registers the pod. It sends only while every
    protocol container of the pod is ready, so a wedged container lets the
    lease run out.

backend_register.tag:
  type: string
  default: ""
  helm: backend_register.tag
  description: |
    The storage shard this pod serves: one tag is one NFS volume and one
    backend release. It is never the protocol; a pod serves every protocol.

backend_register.vhosts:
  type: integer
  default: 100
  helm: backend_register.vhosts
  see_also: [director_service.assignment_policy]
  description: |
    The pod's weight on the ring, from `1` to `100`. Under
    `assignment_policy: least_sessions`, `0` drains the backend: it takes no
    new users.

telemetry.liveness_watchdog.liveness_watchdog_enabled:
  type: boolean
  default: false
  helm: telemetry.livenessWatchdog.enabled
  description: |
    Restart a container whose request path is wedged (a deadlock, a hung NFS
    handle) while the process still answers. The self-check touches nothing
    shared, so a database hiccup restarts nothing.

telemetry.liveness_watchdog.liveness_watchdog_interval_seconds:
  type: integer
  unit: seconds
  default: 10
  helm: telemetry.livenessWatchdog.intervalSeconds
  description: |
    How often the self-check runs.

telemetry.liveness_watchdog.liveness_watchdog_timeout_seconds:
  type: integer
  unit: seconds
  default: 5
  helm: telemetry.livenessWatchdog.timeoutSeconds
  description: |
    How long one self-check may take before it counts as failed.

telemetry.liveness_watchdog.liveness_watchdog_failure_threshold:
  type: integer
  default: 3
  helm: telemetry.livenessWatchdog.failureThreshold
  description: |
    Failed self-checks in a row before the liveness probe fails.

telemetry.liveness_watchdog.liveness_watchdog_fault_injection_enabled:
  type: boolean
  default: false
  advanced: true
  helm: telemetry.livenessWatchdog.faultInjectionEnabled
  description: |
    Expose `POST /debug/fault/deadlock`, which wedges the self-check so you
    can confirm on a live pod that the watchdog restarts it. Leave it off
    outside such a check.

telemetry.telemetry_pprof_enabled:
  type: boolean
  default: false
  helm: telemetry.pprof.enabled
  description: |
    Serve the Go profilers and `/debug/loglevel` on the telemetry port. Every
    component logs a warning at each start while it is on.

telemetry.telemetry_block_profile_rate:
  type: integer
  default: 0
  helm: telemetry.pprof.blockProfileRate
  see_also: [telemetry.telemetry_mutex_profile_fraction]
  description: |
    One sample per this many nanoseconds of blocked time; `0` is off, and
    `/debug/pprof/block` then answers with an empty profile. Every blocking
    operation pays while it is on.

telemetry.telemetry_mutex_profile_fraction:
  type: integer
  default: 0
  helm: telemetry.pprof.mutexProfileFraction
  see_also: [telemetry.telemetry_block_profile_rate]
  description: |
    One sample per this many mutex contention events; `0` is off, and
    `/debug/pprof/mutex` then answers with an empty profile. Every contended
    mutex pays while it is on.

warden_service.state_backend:
  type: string
  default_text: "`memory`"
  values: [memory, redis]
  helm: components.warden.service.state_backend
  description: |
    Where warden keeps its penalty counters, session accounting and kick bus.
    `memory` keeps them in the pod and allows one replica only; `redis`
    shares them and allows any number.

auth.token.redis_password:
  type: string
  default: ""
  description: |
    Password of the Redis that holds session tokens. Set it to
    `${YARILO_REDIS_PASSWORD}`; it wins over a password in the URL.

warden_service.redis_password:
  type: string
  default: ""
  description: |
    Password of warden's Redis. Set it to `${YARILO_REDIS_PASSWORD}`; it wins
    over a password in the URL.

locks_service.redis_password:
  type: string
  default: ""
  description: |
    Password of the Redis behind yarilo-locks. Set it to
    `${YARILO_REDIS_PASSWORD}`; it wins over a password in the URL.

redis.passwordSecret:
  source: chart
  type: map
  default: {name: "", key: password}
  description: |
    The Secret (`name`, `key`) whose value becomes `YARILO_REDIS_PASSWORD` in
    every process that opens Redis. The bundled Redis starts with the same
    password.

locks_service.mode:
  type: string
  default: ""
  values: [remote, embedded]
  description: |
    `remote` serves locks over mTLS TCP with Redis behind it, and is the only
    mode for Kubernetes. `embedded` keeps them in memory behind a Unix socket,
    for tests and single-process runs.

locks_service.listen:
  type: string
  default: ""
  helm: components.locks.service.listen
  description: |
    Address yarilo-locks serves on in remote mode, `:9104` in the chart.

locks_service.redis:
  type: string
  default: ""
  description: |
    Redis URL that holds the lock state in remote mode. Leave the password out
    of the URL; the ConfigMap renders the URL as written.

locks_service.socket:
  type: string
  default: ""
  description: |
    Unix socket yarilo-locks serves on in embedded mode.

locks_client.mode:
  type: string
  default: ""
  values: [remote, embedded]
  description: |
    How a session process reaches yarilo-locks; matches the service's mode.

locks_client.endpoints:
  type: list
  default: []
  description: |
    yarilo-locks addresses a session process dials in remote mode, normally
    the ClusterIP Service on `:9104`.

locks_client.socket:
  type: string
  default: ""
  description: |
    Unix socket a session process dials in embedded mode.

internal_tls.enabled:
  type: boolean
  default: true
  helm: internalTLS.enabled
  description: |
    Internal mTLS for every internal port. In the chart this one switch drives
    the config, the mounts and the certificates of every component. Off, every
    internal port is plain and each server logs that roles are not checked.

internal_tls.cert:
  type: string
  default: /etc/yarilo/tls/tls.crt
  description: |
    This component's certificate.

internal_tls.key:
  type: string
  default: /etc/yarilo/tls/tls.key
  description: |
    The private key of `cert`.

internal_tls.ca:
  type: string
  default: /etc/yarilo/tls/ca.crt
  description: |
    The CA every internal peer's certificate must chain to.

internal_tls.server_name:
  type: string
  default: ""
  helm: internalTLS.serverName
  description: |
    The one name every internal client verifies its peer against, instead of
    the host it dialed. The chart sets it to `<release>-internal` and puts it
    in every certificate it makes; a certificate you provide must carry it as
    a SAN. Empty with internal TLS on fails at startup.

internalTLS.ca.secretName:
  source: chart
  type: string
  default: ""
  description: |
    An existing `kubernetes.io/tls` Secret with the CA the chart signs
    internal certificates with. Empty, the chart makes a CA once and keeps it
    in `<release>-internal-ca`. A GitOps renderer must set it (or use
    cert-manager): without `lookup` it would make a new CA on every render.

internalTLS.certGeneration:
  source: chart
  type: integer
  default: 0
  description: |
    Raise it to re-issue every certificate the chart made. There is no
    renewal by age.

internalTLS.certManager.enabled:
  source: chart
  type: boolean
  default: false
  see_also: [internalTLS.certManager.issuerRef]
  description: |
    Let cert-manager make and renew the internal certificates: one
    `Certificate` per role, with the same names.

internalTLS.certManager.issuerRef:
  source: chart
  type: map
  default: {kind: Issuer, name: ""}
  see_also: [internalTLS.certManager.enabled]
  description: |
    The cert-manager issuer that signs them.

networkPolicy.enabled:
  source: chart
  type: boolean
  default: true
  description: |
    Render ingress policies that state on the network what the peer roles
    state in the handshake. They need a CNI that enforces them; egress is not
    restricted.

networkPolicy.adminFrom:
  source: chart
  type: list
  default: []
  description: |
    Peers for operator tools outside the chart's pods (smoketest,
    yarilo-migrate) on the admin, auth and locks ports. Empty: `kubectl exec`
    into backend-api or the director.

networkPolicy.mtaFrom:
  source: chart
  type: list
  default: []
  description: |
    Who may reach the MTA-facing ports. Empty is everyone.

networkPolicy.telemetryFrom:
  source: chart
  type: list
  default: []
  description: |
    Who may reach telemetry and health. Empty is everyone. Kubelet probes come
    from the node and keep passing when it is narrowed.

director_service.assignment_policy:
  type: string
  default: hash
  values: [hash, least_sessions, domain]
  helm: components.director.assignment_policy
  description: |
    How a user's first backend is chosen; sticky pins and moves do not consult
    it. The choices are described in [Initial placement policy](#initial-placement-policy).

director_service.director_domain_expire:
  type: integer
  unit: seconds
  default: 900
  helm: components.director.director_domain_expire
  description: |
    How long a domain placed by `assignment_policy: domain` keeps its backend
    with no session. Separate from the user TTL so that a domain is not
    forgotten between two logins.

director_service.director_domain_rebalance_percent:
  type: integer
  default: 0
  helm: components.director.director_domain_rebalance_percent
  see_also: [director_service.director_domain_rebalance_interval, director_service.director_domain_rebalance_cooldown]
  description: |
    Move one domain down when the busiest backend of a tag is this much above
    the quietest. `0` is off in the binary; the chart sets `20`, and a `0` in
    the values stays `0`.

director_service.director_domain_rebalance_interval:
  type: integer
  unit: seconds
  default: 60
  helm: components.director.director_domain_rebalance_interval
  description: |
    How often the rebalance is judged.

director_service.director_domain_rebalance_cooldown:
  type: integer
  unit: seconds
  default: 600
  helm: components.director.director_domain_rebalance_cooldown
  description: |
    How long a moved domain is left alone, so that two backends either side of
    the line do not trade it.

director_service.user_expire:
  type: integer
  unit: seconds
  default: 900
  helm: components.director.user_expire
  description: |
    How long a user's pin outlives their last session. While any session is
    open the pin is refreshed; after it, the user returns to their hash
    backend.

director_service.user_kick_delay:
  type: integer
  unit: seconds
  default: 2
  helm: components.director.user_kick_delay
  description: |
    An admin kick, usually the tail of a move, waits this long so a command in
    flight on the old backend completes. A kick for a dead backend and a
    conflict kick never wait. `0` kicks at once.

director_service.max_parallel_kicks:
  type: integer
  default: 100
  helm: components.director.max_parallel_kicks
  description: |
    When a backend goes down, its sessions are kicked in batches of this size,
    which spreads the re-logins over the surviving backends. `0` kicks all at
    once.

director_service.max_parallel_moves:
  type: integer
  default: 5
  helm: components.director.max_parallel_moves
  description: |
    Confirmed kills in flight while `yarctl director backends flush` drains a
    backend.

auth.passdb[].driver:
  type: string
  default: ""
  values: [sqlite, mysql, postgres, passwd-file, static]
  description: |
    The backend this passdb entry reads.

auth.passdb[].dsn:
  type: string
  default: ""
  description: |
    SQL drivers: the driver's connection string. `${ENV_VAR}` is expanded at
    startup.

auth.passdb[].passwd_file_path:
  type: string
  default: ""
  aliases: [passwd_file]
  description: |
    `passwd-file` driver: path to the user file. `${ENV_VAR}` is expanded at
    startup.

auth.passdb[].passdb_sql_query:
  type: string
  default: ""
  aliases: [password_query]
  see_also: ["auth.passdb[].userdb_sql_query"]
  description: |
    SQL: a custom `SELECT` for authentication. Unset, the built-in
    `yarilo_users` schema is used. See [Custom queries](#custom-queries).

auth.passdb[].userdb_sql_query:
  type: string
  default: ""
  aliases: [user_query]
  see_also: ["auth.passdb[].passdb_sql_query"]
  description: |
    SQL: the userdb lookup (`home`, `mail`, extra fields) used by delivery,
    quota-status and the backend API. Unset, the built-in
    `SELECT username, home, mail FROM yarilo_users WHERE username = %u AND enabled = 1`
    runs, so set it with a schema of your own. See [Contract](#contract).

auth.passdb[].userdb_sql_iterate_query:
  type: string
  default: ""
  aliases: [iterate_query]
  description: |
    SQL: the query that lists users, for admin tooling.

auth.passdb[].passdb_default_password_scheme:
  type: string
  default_text: "`PLAIN` for SQL, `CRYPT` for passwd-file"
  aliases: [default_pass_scheme]
  description: |
    The scheme assumed when a stored password has neither a `{SCHEME}` prefix
    nor a crypt(3) marker.

auth.passdb[].skip_schema:
  type: boolean
  default: false
  description: |
    SQL: skip `CREATE TABLE IF NOT EXISTS yarilo_users` at startup, for an
    existing schema.

auth.passdb[].max_open_conns:
  type: integer
  default_text: "`25` for mysql, `8` for postgres, `1` for sqlite"
  see_also: ["auth.passdb[].max_idle_conns"]
  description: |
    SQL: connections the entry's pool may hold. `0` is unlimited. A negative
    value is refused at startup.

auth.passdb[].max_idle_conns:
  type: integer
  default_text: the same as `max_open_conns`
  see_also: ["auth.passdb[].max_open_conns"]
  description: |
    SQL: idle connections kept for reuse. `0` keeps none. A negative value is
    refused at startup.

auth.passdb[].conn_max_lifetime:
  type: integer
  unit: seconds
  default_text: "`300`"
  description: |
    SQL: age at which a connection is recycled. `0` is never. A negative
    value is refused at startup.

auth.passdb[].conn_max_idle_time:
  type: integer
  unit: seconds
  default_text: "`60`"
  description: |
    SQL: how long an idle connection is kept. `0` is never. A negative value
    is refused at startup.

auth.passdb[].username_filter:
  type: string
  default: ""
  added: 2.4.2
  description: |
    Any driver: the entry is tried only for names that match. Masks are
    separated by spaces or commas, with `*` and `?` wildcards, case-sensitive;
    a leading `!` excludes. With at least one inclusion, a name must match
    one. A skipped entry is as if absent for that name: on login, on a userdb
    lookup, and for SCRAM. Empty tries every name.

auth.passdb[].static_password:
  type: string
  default: ""
  see_also: ["auth.passdb[].nopassword"]
  description: |
    `static` driver: the shared password, with a `{SCHEME}` prefix or in
    `passdb_default_password_scheme`. `${ENV_VAR}` is expanded at startup.

auth.passdb[].nopassword:
  type: boolean
  default: false
  see_also: ["auth.passdb[].static_password"]
  description: |
    `static` driver: accept **any** password, for proxy front-ends where the
    upstream authenticates. Excludes `static_password`.

auth.passdb[].fields:
  type: map
  default: {}
  description: |
    `static` driver: templated user fields, expanding `%u`, `%n` and `%d`.
    `userdb_`-prefixed keys fill the userdb; bare keys travel on the passdb
    path (`allow_nets`, `proxy`, …).

auth.passdb[].userdb_static_allow_all_users:
  type: boolean
  default: false
  added: 2.4.2
  description: |
    `static` driver: `false` answers a userdb lookup that no login preceded
    only for a user some passdb in the chain knows; `true` answers any name. A
    static entry is its own passdb too, so the two agree for every name its
    `username_filter` accepts.

auth.auth_max_attempts:
  type: integer
  default: 3
  helm: components.auth.auth_max_attempts
  description: |
    Failed authentications one IMAP or POP3 connection may make before it is
    closed. Submission closes after the first.

auth.auth_failure_delay:
  type: integer
  unit: seconds
  default: 2
  helm: components.auth.failure_delay
  see_also: [auth.internal_failure_delay_ms]
  description: |
    How long every failed reply (wrong password, unknown user, malformed
    exchange) is held back, so the timing does not tell an unknown user from
    a wrong password. `0` disables it, for tests.

auth.internal_failure_delay_ms:
  type: integer
  unit: milliseconds
  default: 2000
  helm: components.auth.internal_failure_delay_ms
  see_also: [auth.auth_failure_delay]
  description: |
    The same delay for internal failures, such as a passdb that does not
    answer.

auth.cache.auth_cache_size:
  type: string
  default: ""
  aliases: [cache_size]
  helm: components.auth.cache.cache_size
  description: |
    Size of the in-process cache of passdb answers (`"100M"`, `"512k"`).
    Empty or `0` disables it; the chart sets `100M`.

auth.cache.auth_cache_ttl:
  type: integer
  unit: seconds
  default: 1800
  aliases: [ttl_seconds]
  helm: components.auth.cache.ttl_seconds
  description: |
    How long a successful answer is kept.

auth.cache.auth_cache_negative_ttl:
  type: integer
  unit: seconds
  default: 1800
  aliases: [negative_ttl_seconds]
  helm: components.auth.cache.negative_ttl_seconds
  description: |
    How long a failed answer is kept. Each entry carries a digest of the
    password that produced it, so a cached failure answers only that password
    again and cannot lock out the right one.

threading.threading_enabled:
  type: boolean
  default: true
  helm: components.backend.threading.enabled
  see_also: [threading.threading_cache_idle]
  description: |
    Record conversations at delivery time. Turning it off leaves the existing
    sidecars on disk, and turning it back on picks them up again; mail
    delivered in between stays one conversation per message until
    `--thread-backfill --force` runs for the account.

threading.threading_cache_idle:
  type: integer
  unit: seconds
  default: 300
  helm: components.backend.threading.cache_idle
  see_also: [threading.threading_enabled]
  description: |
    How long a process keeps an account's folded sidecar after its last
    delivery. `0` never caches, and every delivery then pays the fold.

sieve.sieve_enabled:
  type: boolean
  default: false
  helm: sieve.sieve_enabled
  description: |
    Run Sieve on LMTP delivery.

sieve.sieve_max_script_size:
  type: integer
  unit: bytes
  default: 65536
  aliases: [protocol.managesieve.max_script_size]
  helm: sieve.sieve_max_script_size
  description: |
    Largest compiled script, one limit for delivery and ManageSieve alike. The
    alias and this key set to different values refuse startup.

sieve.sieve_max_redirects:
  type: integer
  default: 32
  helm: sieve.sieve_max_redirects
  description: |
    `redirect` actions per message (RFC 5228 §6.2).

sieve.sieve_max_num_scripts:
  type: integer
  default: 0
  helm: sieve.sieve_max_num_scripts
  see_also: [sieve.sieve_max_storage]
  description: |
    Scripts one user may store. `0` is unlimited. See [ManageSieve](#managesieve).

sieve.sieve_max_storage:
  type: integer
  unit: bytes
  default: 0
  helm: sieve.sieve_max_storage
  see_also: [sieve.sieve_max_num_scripts]
  description: |
    Total size of one user's stored scripts. `0` is unlimited.

sieve.sieve_max_actions:
  type: integer
  default: 32
  helm: sieve.sieve_max_actions
  description: |
    Actions one script may take in all (`fileinto`, `redirect`, `keep`, …),
    a guard against runaway scripts. `0` is unlimited.

sieve.sieve_global:
  type: string
  default: ""
  helm: sieve.sieve_global
  see_also: [sieve.sieve_global_scripts]
  description: |
    Directory of the scripts `include :global` names, one `<name>.sieve` each.
    Users cannot write it. Empty: none.

sieve.sieve_global_scripts:
  source: chart
  type: map
  default: {}
  see_also: [sieve.sieve_global]
  description: |
    Global scripts by name. The chart puts them in a ConfigMap mounted at
    `sieve_global` in the lmtp and imap containers.

sieve.sieve_vacation_enabled:
  type: boolean
  default: true
  helm: sieve.sieve_vacation_enabled
  description: |
    Permit the `vacation` extension (RFC 5230).

sieve.sieve_vacation_min_period:
  type: integer
  unit: seconds
  default: 86400
  helm: sieve.sieve_vacation_min_period
  see_also: [sieve.sieve_vacation_max_period, sieve.sieve_vacation_default_period]
  description: |
    Shortest reply interval; a shorter `:days` or `:seconds` is raised to it.
    `0` is no minimum.

sieve.sieve_vacation_max_period:
  type: integer
  unit: seconds
  default: 5184000
  helm: sieve.sieve_vacation_max_period
  see_also: [sieve.sieve_vacation_min_period]
  description: |
    Longest reply interval (60 days); a longer one is lowered to it. `0` is no
    maximum.

sieve.sieve_vacation_default_period:
  type: integer
  unit: seconds
  default: 604800
  helm: sieve.sieve_vacation_default_period
  see_also: [sieve.sieve_vacation_min_period]
  description: |
    Interval when the script gives none (7 days). It is kept within the
    minimum too, so `0` replies to every message only with
    `sieve_vacation_min_period: 0`.

sieve.sieve_vacation_default_subject:
  type: string
  default: ""
  helm: sieve.sieve_vacation_default_subject
  description: |
    Subject of a reply to a message without one, when the script gives none.
    Empty is `Automated reply`.

sieve.sieve_vacation_default_subject_template:
  type: string
  default: ""
  helm: sieve.sieve_vacation_default_subject_template
  description: |
    Subject of a reply when the script gives none, with `%{subject}` for the
    message's subject. Empty is `Auto: %{subject}`.

sieve.sieve_vacation_use_original_recipient:
  type: boolean
  default: false
  helm: sieve.sieve_vacation_use_original_recipient
  description: |
    Count the LMTP original recipient (ORCPT) as the user's address. Only a
    relay that sends ORCPT gives one; see [LMTP](/protocols/lmtp#original-recipient-orcpt).

sieve.sieve_vacation_check_recipient:
  type: boolean
  default: true
  helm: sieve.sieve_vacation_check_recipient
  description: |
    Reply only to a message that names the user in `To`, `Cc`, `Bcc` or
    `Resent-*`.

sieve.sieve_vacation_send_from_recipient:
  type: boolean
  default: false
  helm: sieve.sieve_vacation_send_from_recipient
  description: |
    Send the reply with the recipient as envelope sender instead of `<>`.

sieve.sieve_vacation_to_header_ignore_envelope:
  type: boolean
  default: false
  helm: sieve.sieve_vacation_to_header_ignore_envelope
  description: |
    Address the reply to the first address in `Sender`, `Resent-From` or
    `From`, even when it is not the envelope sender.

sieve.sieve_spamtest_status_header:
  type: string
  default: ""
  helm: sieve.sieve_spamtest_status_header
  see_also: [sieve.sieve_spamtest_max_value]
  description: |
    Header carrying the spam score for `spamtest` (RFC 5235), such as
    `X-Spam-Score`. Empty: the test reports "not scanned".

sieve.sieve_spamtest_max_value:
  type: number
  default: 10
  helm: sieve.sieve_spamtest_max_value
  see_also: [sieve.sieve_spamtest_status_header]
  description: |
    The raw header value mapped to the top of the 0..10 scale (0..100 with
    `:percent`).

sieve.sieve_virustest_status_header:
  type: string
  default: ""
  helm: sieve.sieve_virustest_status_header
  see_also: [sieve.sieve_virustest_max_value]
  description: |
    Header carrying the virus verdict for `virustest` (RFC 5235). Empty: "not
    scanned".

sieve.sieve_virustest_max_value:
  type: number
  default: 5
  helm: sieve.sieve_virustest_max_value
  see_also: [sieve.sieve_virustest_status_header]
  description: |
    The raw header value mapped to the top of the 0..5 virus scale.

sieve.sieve_submission_host:
  type: string
  default: ""
  helm: sieve.sieve_submission_host
  description: |
    The MTA outbound mail goes through (`host[:port]`, port 25 by default).
    Empty: `redirect` and vacation replies are dropped without a word.

sieve.sieve_submission_ssl:
  type: string
  default: "no"
  values: ["no", smtps, starttls]
  helm: sieve.sieve_submission_ssl
  description: |
    Transport security towards that MTA.

sieve.sieve_submission_timeout:
  type: integer
  unit: seconds
  default: 30
  helm: sieve.sieve_submission_timeout
  description: |
    Connect and command timeout towards that MTA.

sieve.sieve_submission_auth_secret:
  type: string
  default: ""
  helm: sieve.sieve_submission_auth_secret
  description: |
    Name of a Kubernetes Secret with `user` and `password` keys for SMTP AUTH.
    Empty relays without authentication.

sieve.sieve_default_name:
  type: string
  default: yarilo
  helm: sieve.sieve_default_name
  description: |
    Name of the per-user default script, seeded as `<name>.sieve` on first
    delivery.

sieve.sieve_extensions:
  type: list
  default: []
  helm: sieve.sieve_extensions
  see_also: [sieve.sieve_global_extensions]
  description: |
    Extensions users may `require`. Empty allows every extension the engine
    declares; a non-empty list is enforced at `PUTSCRIPT` and at delivery.

sieve.sieve_global_extensions:
  type: list
  default: []
  helm: sieve.sieve_global_extensions
  see_also: [sieve.sieve_extensions]
  description: |
    Extensions only the administrator's scripts may use, on top of
    `sieve_extensions`. A user's script never gets them, even when
    `sieve_extensions` lists them. See
    [Whose script gets which extensions](#whose-script-gets-which-extensions).

sieve.sieve_scripts_driver:
  type: string
  default_text: "`fs`"
  values: [fs, redis]
  helm: sieve.sieve_scripts_driver
  see_also: [sieve.sieve_scripts_dict]
  description: |
    Where scripts are stored: `fs` keeps them as files in the user's home,
    `redis` in the dict that `sieve_scripts_dict` names.

sieve.sieve_scripts_dict:
  type: string
  default: ""
  helm: sieve.sieve_scripts_dict
  see_also: [sieve.sieve_scripts_driver]
  description: |
    Name of the dict in `dicts:` used with `sieve_scripts_driver: redis`.
    Ignored for `fs`.

protocol.managesieve.max_invalid_commands:
  type: integer
  default: 3
  helm: protocol.managesieve.max_invalid_commands
  description: |
    Unknown commands before authentication after which the server says `BYE`
    and closes.

protocol.managesieve.managesieve_max_line_length:
  type: integer
  unit: bytes
  default: 65536
  helm: protocol.managesieve.managesieve_max_line_length
  description: |
    A command line or a literal, a script's body aside. A larger literal is
    refused before it is read with `NO "Literal size too large."`, and when
    the client is already sending it (`{N+}`), with `BYE` and close. Before
    authentication the bound is 8192 bytes.

sieve.sieve_pipe_bin_dir:
  type: string
  default: /usr/lib/yarilo/sieve-pipe
  helm: sieve.sieve_pipe_bin_dir
  description: |
    Directory of the programs `vnd.yarilo.pipe` may run.

sieve.sieve_pipe_socket_dir:
  type: string
  default: sieve-pipe
  helm: sieve.sieve_pipe_socket_dir
  description: |
    Directory of the sockets `vnd.yarilo.pipe` may use, searched first.

sieve.sieve_pipe_exec_timeout:
  type: integer
  unit: seconds
  default: 10
  helm: sieve.sieve_pipe_exec_timeout
  description: |
    How long one `vnd.yarilo.pipe` program may run.

sieve.sieve_pipe_input_eol:
  type: string
  default: crlf
  values: [crlf, lf]
  helm: sieve.sieve_pipe_input_eol
  description: |
    Line endings written to the program's standard input.

sieve.sieve_filter_bin_dir:
  type: string
  default: /usr/lib/yarilo/sieve-filter
  helm: sieve.sieve_filter_bin_dir
  description: |
    Directory of the programs `vnd.yarilo.filter` may run.

sieve.sieve_filter_socket_dir:
  type: string
  default: sieve-filter
  helm: sieve.sieve_filter_socket_dir
  description: |
    Directory of the sockets `vnd.yarilo.filter` may use, searched first.

sieve.sieve_filter_exec_timeout:
  type: integer
  unit: seconds
  default: 10
  helm: sieve.sieve_filter_exec_timeout
  description: |
    How long one `vnd.yarilo.filter` program may run.

sieve.sieve_filter_input_eol:
  type: string
  default: crlf
  values: [crlf, lf]
  helm: sieve.sieve_filter_input_eol
  description: |
    Line endings written to the program's standard input.

sieve.sieve_execute_bin_dir:
  type: string
  default: /usr/lib/yarilo/sieve-execute
  helm: sieve.sieve_execute_bin_dir
  description: |
    Directory of the programs `vnd.yarilo.execute` may run.

sieve.sieve_execute_socket_dir:
  type: string
  default: sieve-execute
  helm: sieve.sieve_execute_socket_dir
  description: |
    Directory of the sockets `vnd.yarilo.execute` may use, searched first.

sieve.sieve_execute_exec_timeout:
  type: integer
  unit: seconds
  default: 10
  helm: sieve.sieve_execute_exec_timeout
  description: |
    How long one `vnd.yarilo.execute` program may run.

sieve.sieve_execute_input_eol:
  type: string
  default: crlf
  values: [crlf, lf]
  helm: sieve.sieve_execute_input_eol
  description: |
    Line endings written to the program's standard input.

sieve.sieve_report_user_agent:
  type: string
  default: yarilo
  helm: sieve.sieve_report_user_agent
  description: |
    The `User-Agent` field written into the `message/feedback-report` part.

director_service.listen:
  type: string
  default: ":9102"
  helm: components.director.directorPort
  description: |
    Address for `LOOKUP` from the login pods and for the ring protocol between
    directors. The chart takes a port number and renders `:<port>`.

director_service.api.listen:
  type: string
  default: ":9103"
  helm: components.director.api.port
  see_also: [director_service.api.allowed_nets]
  description: |
    Address of the admin API; see [Director API](/architecture/director_api).
    The chart takes a port number.

director_service.api.allowed_nets:
  type: list
  default: []
  helm: components.director.api.allowed_nets
  description: |
    CIDRs the admin API accepts requests from, on top of its token. Empty
    allows all.

telemetry.listen:
  type: string
  default: ":8080"
  helm: telemetry.listen
  description: |
    Address of the Prometheus metrics and health endpoints.

director_service.ping_interval:
  type: integer
  unit: seconds
  default: 30
  helm: components.director.ping_interval
  see_also: [director_service.ping_timeout]
  description: |
    Keepalive pings to login pods and ring peers.

director_service.ping_timeout:
  type: integer
  unit: seconds
  default: 10
  helm: components.director.ping_timeout
  see_also: [director_service.ping_interval]
  description: |
    How long to wait for a `PONG` before the connection is closed.

director_service.write_timeout:
  type: integer
  unit: seconds
  default: 10
  helm: components.director.write_timeout
  description: |
    How long one push or reply write may take. `0` is no bound.

director_service.shutdown.session_grace_period:
  type: integer
  unit: seconds
  default: 30
  helm: components.director.shutdown.session_grace_period
  description: |
    How long the director waits after `SIGTERM` before it exits. It leaves the
    ring gracefully in that time.

director_service.peers:
  type: list
  default: []
  helm: components.director.peers
  description: |
    Seeds for a one-time ring join. Empty with more than one replica, the
    chart seeds from the headless `-director-ring` Service.

director_service.backend_unreachable_reporters:
  type: integer
  default: 2
  helm: components.director.backend_unreachable_reporters
  see_also: [director_service.backend_unreachable_window]
  description: |
    Distinct login pods that must report a backend unreachable before it is
    evicted early. A single-replica login fleet cannot give two, so set `1`
    there; the lease stays the backstop.

director_service.backend_unreachable_window:
  type: integer
  unit: seconds
  default: 5
  helm: components.director.backend_unreachable_window
  see_also: [director_service.backend_unreachable_reporters]
  description: |
    The window those reports must arrive in.

director_service.join_allowed_nets:
  type: list
  default: []
  helm: components.director.join_allowed_nets
  description: |
    CIDRs a ring join is accepted from. Empty allows all.

director_service.anti_entropy_interval:
  type: integer
  unit: seconds
  default: 3
  helm: components.director.anti_entropy_interval
  description: |
    Each director re-sends its member and tombstone list over every live ring
    connection this often, repairing a view that has diverged. `0` turns it
    off.

director_service.tombstone_ttl:
  type: integer
  unit: seconds
  default: 600
  helm: components.director.tombstone_ttl
  description: |
    How long a dead member's tombstone is kept. `0` keeps it for good.

director_service.mail_servers[].host:
  type: string
  default: ""
  helm: components.director.backends[].host
  description: |
    Hostname of a static backend, typically a headless Service such as
    `yarilo-imap.yarilo-backend.svc.cluster.local`. Every IP it resolves to
    joins the ring.

director_service.mail_servers[].port:
  type: integer
  default: 0
  helm: components.director.backends[].port
  description: |
    Backend port the login pod dials.

director_service.mail_servers[].tag:
  type: string
  default: ""
  helm: components.director.backends[].tag
  description: |
    Pool label. Empty is the default pool.

director_service.mail_servers[].vhosts:
  type: integer
  default_text: "`100`"
  helm: components.director.backends[].vhosts
  description: |
    Ring weight, `1` to `100`. `0` routes no users to the backend; under
    `assignment_policy: least_sessions` it drains.

director_service.ring_tls_server_name:
  type: string
  default: ""
  helm: components.director.internalTLS.ringTlsServerName
  description: |
    The name a ring dial verifies, since peers are dialled by pod IP. The
    chart sets `<release>-director-ring`, and the director's certificate must
    carry it as a SAN.

director_service.seed_poll_interval:
  type: integer
  unit: seconds
  default: 2
  helm: components.director.seed_poll_interval
  see_also: [director_service.seed_poll_idle_interval, director_service.min_members]
  description: |
    How often the seed is polled while the ring is below `min_members`. A
    negative value polls once.

director_service.seed_poll_idle_interval:
  type: integer
  unit: seconds
  default: 2
  helm: components.director.seed_poll_idle_interval
  see_also: [director_service.seed_poll_interval]
  description: |
    The poll interval once the ring holds `min_members`. Raising it saves
    polling, and a dead member is evicted more slowly.

director_service.min_members:
  type: integer
  default: 3
  helm: components.director.min_members
  description: |
    The ring size the seed polling aims for. Below it, the director polls at
    `seed_poll_interval`.

director_service.ring_secret:
  type: string
  default: ""
  helm: components.director.ring_secret
  description: |
    Authenticates every join and every ring connection. Without it a director
    never joins and runs alone. The chart generates it into the Secret
    `<release>-director-ring-secret`.

auth.policy.auth_policy_server_url:
  type: string
  default: ""
  aliases: [url]
  helm: components.auth.policy.url
  description: |
    The policy server. Empty disables the hook. A URL ending in `&` extends
    its query string instead of starting a new one
    (`https://w/?tenant=42&`).

auth.policy.auth_policy_server_api_header:
  type: string
  default: ""
  aliases: [api_header]
  helm: components.auth.policy.api_header
  see_also: [components.auth.policy.api_header_secret_ref]
  description: |
    `"Key: value"` sends a header of your own; `"value"` sends
    `X-API-Key: value`. `${ENV}` is expanded.

components.auth.policy.api_header_secret_ref:
  source: chart
  type: map
  default: {name: "", key: api_header}
  see_also: [auth.policy.auth_policy_server_api_header]
  description: |
    A Secret (`name`, `key`) holding the API header. The chart renders
    `"${YARILO_AUTH_POLICY_API_HEADER}"` and sets the variable in the
    yarilo-auth pod, so the value stays out of the ConfigMap. Setting it
    together with `api_header` fails the render.

auth.policy.auth_policy_hash_mech:
  type: string
  default: sha256
  values: [sha256, sha512]
  aliases: [hash_mech]
  helm: components.auth.policy.hash_mech
  description: |
    Digest of `pwhash`. It must match the policy server's setting.

auth.policy.auth_policy_hash_nonce:
  type: string
  default: ""
  aliases: [hash_nonce]
  helm: components.auth.policy.hash_nonce
  see_also: [components.auth.policy.hash_nonce_secret_ref]
  description: |
    Salt mixed into `pwhash`, **required when a policy server is set**. Two
    deployments with different nonces have different hash spaces. `${ENV}` is
    expanded.

components.auth.policy.hash_nonce_secret_ref:
  source: chart
  type: map
  default: {name: "", key: hash_nonce}
  see_also: [auth.policy.auth_policy_hash_nonce]
  description: |
    A Secret (`name`, `key`) holding the nonce. The chart renders
    `"${YARILO_AUTH_POLICY_HASH_NONCE}"` and sets the variable in the
    yarilo-auth pod. Setting it together with `hash_nonce` fails the render.

auth.policy.auth_policy_hash_truncate:
  type: integer
  unit: bits
  default: 12
  aliases: [hash_truncate_bits]
  helm: components.auth.policy.hash_truncate_bits
  description: |
    Top bits of the digest that are sent. `12` gives 4096 buckets, enough for
    rate-limit patterns and useless for password recovery. `0` sends the full
    digest.

auth.policy.timeout_ms:
  type: integer
  unit: milliseconds
  default: 5000
  helm: components.auth.policy.timeout_ms
  description: |
    Cap on one round trip to the policy server.

auth.policy.auth_policy_reject_on_fail:
  type: boolean
  default: false
  aliases: [reject_on_fail]
  helm: components.auth.policy.reject_on_fail
  description: |
    `true` rejects the login when the policy server is unreachable or answers
    something malformed. `false` carries on without its guidance.

auth.policy.auth_policy_log_only:
  type: boolean
  default: false
  aliases: [log_only]
  helm: components.auth.policy.log_only
  description: |
    Ask the policy server and log its verdicts without enforcing them, to roll
    out a new policy in shadow mode.

auth.policy.auth_policy_check_before_auth:
  type: boolean
  default: true
  aliases: [check_before]
  helm: components.auth.policy.check_before
  description: |
    Ask `?command=allow` before the passdb chain runs. A rejection skips the
    passdb call entirely.

auth.policy.auth_policy_check_after_auth:
  type: boolean
  default: true
  aliases: [check_after]
  helm: components.auth.policy.check_after
  description: |
    Ask `?command=allow` once the chain's result is known. A rejection turns a
    successful login into a failure (account-takeover detection).

auth.policy.auth_policy_report_after_auth:
  type: boolean
  default: true
  aliases: [report_after]
  helm: components.auth.policy.report_after
  description: |
    Send `?command=report` after every decision, without waiting for the
    answer. It never delays the reply to the client.

protocol.lmtp.login_greeting:
  type: string
  default: Yarilo ready.
  helm: protocol.lmtp.login_greeting
  description: |
    Text appended to the `220` banner.

protocol.lmtp.lmtp_add_received_header:
  type: boolean
  default: true
  aliases: [add_received_header]
  helm: protocol.lmtp.add_received_header
  description: |
    Prepend a `Received:` header to every delivered message.

protocol.lmtp.lmtp_add_message_id:
  type: boolean
  default: true
  helm: protocol.lmtp.add_message_id
  description: |
    Synthesise a `Message-ID:` when a message arrives without one. An
    existing header is never rewritten.

protocol.lmtp.lmtp_save_to_detail_mailbox:
  type: boolean
  default: false
  aliases: [save_to_detail_mailbox]
  helm: protocol.lmtp.save_to_detail_mailbox
  description: |
    Deliver `user+folder@domain` to the `folder` mailbox instead of `INBOX`.

protocol.lmtp.lda_mailbox_autocreate:
  type: boolean
  default: false
  helm: protocol.lmtp.lda_mailbox_autocreate
  see_also: [protocol.lmtp.lda_mailbox_autosubscribe]
  description: |
    A delivery to a folder that does not exist creates it. Off, the message
    goes to the detail mailbox if that exists, otherwise to `INBOX`.

protocol.lmtp.lda_mailbox_autosubscribe:
  type: boolean
  default: false
  helm: protocol.lmtp.lda_mailbox_autosubscribe
  see_also: [protocol.lmtp.lda_mailbox_autocreate]
  description: |
    Subscribe a folder that `lda_mailbox_autocreate` made. Without
    `lda_mailbox_autocreate` it does nothing, and startup refuses it.

protocol.lmtp.quota_full_tempfail:
  type: boolean
  default: false
  helm: protocol.lmtp.quota_full_tempfail
  description: |
    Reply for a recipient whose mailbox is full: off, `552 5.2.2`, a
    permanent failure the MTA bounces to the sender; on, `452 4.2.2`, a
    temporary failure the MTA keeps queued and retries.

protocol.lmtp.lmtp_hdr_delivery_address:
  type: string
  default: final
  values: [none, final, original]
  aliases: [hdr_delivery_address]
  helm: protocol.lmtp.hdr_delivery_address
  description: |
    What the `Delivered-To:` header carries; the values are described below.

protocol.lmtp.lmtp_verbose_replies:
  type: boolean
  default: false
  aliases: [verbose_replies]
  helm: protocol.lmtp.verbose_replies
  description: |
    Include diagnostic details in `4xx` and `5xx` replies. Useful for
    debugging; leave it off in production.

protocol.lmtp.lmtp_user_concurrency_limit:
  type: integer
  default: 10
  aliases: [user_concurrency_limit]
  helm: protocol.lmtp.user_concurrency_limit
  description: |
    Concurrent deliveries per user, counted across the cluster through
    yarilo-warden and enforced by yarilo-lmtp-login at `RCPT TO`. Past it the
    recipient gets `451 4.3.0` and the MTA retries. `-1` is unlimited; `0`
    refuses startup. With warden unreachable a delivery is accepted without
    the limit and a warning is logged.

protocol.lmtp.lmtp_max_recipients:
  type: integer
  default: 0
  helm: protocol.lmtp.lmtp_max_recipients
  description: |
    Recipients per transaction, on the backend and in yarilo-lmtp-login,
    advertised as `LIMITS RCPTMAX=N`. The next `RCPT` gets `452 4.5.3`, and
    the MTA sends the rest in another transaction. `0` is unlimited.

protocol.lmtp.read_timeout:
  type: integer
  unit: seconds
  default: 300
  helm: protocol.lmtp.read_timeout
  description: |
    Read timeout per command.

protocol.lmtp.write_timeout:
  type: integer
  unit: seconds
  default: 300
  helm: protocol.lmtp.write_timeout
  description: |
    Write timeout per command.

protocol.lmtp.lmtp_client_workarounds:
  type: list
  default: []
  aliases: [client_workarounds]
  helm: protocol.lmtp.client_workarounds
  description: |
    Compatibility shims for MTA clients that break the protocol; the names
    are described below. Unknown names are ignored.

protocol.lmtp.rate_limit.rate_limit_enabled:
  type: boolean
  default: true
  aliases: [enabled]
  helm: protocol.lmtp.rate_limit.enabled
  description: |
    Gates the whole check.

protocol.lmtp.rate_limit.rate_limit_per_recipient_burst:
  type: integer
  default: 100
  aliases: [per_recipient_burst]
  helm: protocol.lmtp.rate_limit.per_recipient_burst
  see_also: [protocol.lmtp.rate_limit.rate_limit_per_recipient_window_seconds]
  description: |
    Messages allowed per sender IP and recipient inside one window.

protocol.lmtp.rate_limit.rate_limit_per_recipient_window_seconds:
  type: integer
  unit: seconds
  default: 60
  aliases: [per_recipient_window_seconds]
  helm: protocol.lmtp.rate_limit.per_recipient_window_seconds
  see_also: [protocol.lmtp.rate_limit.rate_limit_per_recipient_burst]
  description: |
    Width of the window.

protocol.lmtp.proxy.lmtp_proxy_timeout:
  type: integer
  unit: seconds
  default: 125
  aliases: [timeout]
  helm: protocol.lmtp.proxy.lmtp_proxy_timeout
  description: |
    Cap on one backend delivery: the connect, the LMTP transaction and the
    body together. Past it the recipient gets `451 4.2.0` and the MTA
    retries. A recipient's userdb field `proxy_timeout` replaces it for that
    recipient.

lmtp_login_service.backend_addr:
  type: string
  default: ""
  helm: components.lmtpLogin.backend_addr
  see_also: [lmtp_login_service.director_addr]
  description: |
    Fixed address of the yarilo-lmtp backend, for standalone mode. When both
    this and `director_addr` are set, this wins and a warning is logged at
    start.

lmtp_login_service.director_addr:
  type: string
  default: ""
  helm: components.lmtpLogin.director_addr
  see_also: [lmtp_login_service.backend_addr]
  description: |
    Address of yarilo-director (`:9102`) for the per-recipient `LOOKUP`.

lmtp_login_service.director_tag:
  type: string
  default: ""
  helm: components.lmtpLogin.director_tag
  description: |
    Tag pool for the `LOOKUP`. Empty selects the untagged pool; there is no
    full-ring mode. A per-user `director_tag` from the userdb overrides it.

lmtp_login_service.backend_port:
  type: integer
  default: 0
  helm: components.lmtpLogin.backend_port
  description: |
    Port that replaces the one in the `LOOKUP` result. `0` uses the result
    as it is.

protocol.submission.hostname:
  type: string
  default_text: the top-level `hostname`
  helm: protocol.submission.hostname
  description: |
    EHLO/HELO banner and `Message-ID` domain **for submission only**. Unset
    means the installation's name; see [General](/installation/general).
    Setting it here does not rename the LMTP banner, the `Received:` header
    or a delivered message's `Message-ID`.

protocol.submission.submission_max_mail_size:
  type: string
  default: 40M
  aliases: [max_message_size]
  helm: protocol.submission.max_message_size
  description: |
    Maximum accepted message size. Takes a size with a unit (`40M`) or bytes.

protocol.submission.max_line_length:
  type: integer
  unit: bytes
  default: 4096
  helm: protocol.submission.max_line_length
  description: |
    Maximum SMTP command or DATA line length.

protocol.submission.submission_max_recipients:
  type: integer
  default: 0
  aliases: [max_recipients]
  helm: protocol.submission.max_recipients
  description: |
    Maximum recipients per message. `0` is unlimited.

protocol.submission.recipient_delimiter:
  type: string
  default: "+"
  helm: protocol.submission.recipient_delimiter
  description: |
    Subaddress separator: `user+tag@domain` → `user@domain`. Empty disables
    it.

protocol.submission.submission_client_workarounds:
  type: list
  default: []
  values: [whitespace-before-path, mailbox-for-path]
  aliases: [client_workarounds]
  helm: protocol.submission.client_workarounds
  see_also: [protocol.lmtp.lmtp_client_workarounds]
  description: |
    Compatibility shims for clients that break the protocol. They do the same
    as the [LMTP workarounds](/protocols/lmtp#protocol.lmtp.lmtp_client_workarounds)
    of the same name.

protocol.submission.submission_add_received_header:
  type: boolean
  default: true
  helm: protocol.submission.add_received_header
  description: |
    Prepend a `Received:` trace header to messages before forwarding. Set it
    to `false` to keep the sender's address out of the message.

protocol.submission.relay.submission_relay_host:
  type: string
  default: ""
  aliases: [host]
  helm: protocol.submission.relay.host
  description: |
    Upstream MTA hostname or IP. Empty disables the relay, and submission
    answers `451`.

protocol.submission.relay.submission_relay_port:
  type: integer
  default: 25
  aliases: [port]
  helm: protocol.submission.relay.port
  description: |
    Upstream MTA port.

protocol.submission.relay.submission_relay_user:
  type: string
  default: ""
  aliases: [user]
  helm: protocol.submission.relay.user
  description: |
    SASL PLAIN username sent to the upstream; `%u` (or `%{user}`) is the
    session's user. Empty, with no master, sends no AUTH.

protocol.submission.relay.submission_relay_master_user:
  type: string
  default: ""
  helm: protocol.submission.relay.master_user
  description: |
    Log in as this master acting for `submission_relay_user` (the SASL
    authzid), or for the session's user when that is empty.

protocol.submission.relay.submission_relay_password:
  type: string
  default: ""
  aliases: [password]
  helm: protocol.submission.relay.password
  description: |
    SASL PLAIN password, the master's when one is set. Supports
    `${ENV_VAR}`. In the chart, `relay.password_secret_ref` takes it from a
    Secret instead.

protocol.submission.relay.submission_relay_ssl:
  type: string
  default: "no"
  values: ["no", starttls, smtps]
  aliases: [ssl]
  helm: protocol.submission.relay.ssl
  description: |
    Transport security to the upstream.

protocol.submission.relay.submission_relay_ssl_verify:
  type: boolean
  default: true
  aliases: [ssl_verify]
  helm: protocol.submission.relay.ssl_verify
  description: |
    Verify the upstream's TLS certificate.

protocol.submission.relay.submission_relay_ssl_ca:
  type: string
  default: ""
  helm: protocol.submission.relay.ssl_ca
  description: |
    PEM file the upstream certificate is verified against. Empty means the
    system roots.

protocol.submission.relay.submission_relay_trusted:
  type: boolean
  default: false
  aliases: [trusted]
  helm: protocol.submission.relay.trusted
  description: |
    Send XCLIENT to the upstream with the client's real IP. The upstream
    must advertise XCLIENT.

protocol.submission.relay.submission_relay_connect_timeout:
  type: integer
  unit: seconds
  default: 30
  aliases: [connect_timeout]
  helm: protocol.submission.relay.connect_timeout
  description: |
    TCP connect timeout.

protocol.submission.relay.submission_relay_command_timeout:
  type: integer
  unit: seconds
  default: 300
  aliases: [command_timeout]
  helm: protocol.submission.relay.command_timeout
  description: |
    Per-command timeout.

protocol.imap.imap_idle_notify_interval:
  type: integer
  unit: seconds
  default: 120
  helm: protocol.imap.imap_idle_notify_interval
  description: |
    Interval between unsolicited EXISTS/RECENT responses during IDLE
    (RFC 2177 keepalive). `0` disables them.

protocol.imap.imap_max_line_length:
  type: integer
  unit: bytes
  default: 65536
  helm: protocol.imap.imap_max_line_length
  description: |
    Maximum IMAP command line length. `0` is unlimited.

protocol.imap.imap_id_send:
  type: string
  default: name *
  helm: protocol.imap.imap_id_send
  description: |
    Space-separated key-value pairs sent in the ID response (RFC 2971). `*`
    means the server's own value. An empty string turns the ID extension off
    after login.

protocol.imap.login_greeting:
  type: string
  default: ""
  helm: protocol.imap.login_greeting
  description: |
    Replaces `IMAP server ready` in the **backend's** greeting. Clients
    behind a login proxy see `yarilo-imap-login`'s own greeting, `Yarilo
    Login ready`, which this key does not change. Empty keeps the default.

protocol.imap.imap_logout_format:
  type: string
  default: ""
  helm: protocol.imap.imap_logout_format
  description: |
    Format of the line logged at session end; the variables are listed
    below. Empty logs no stats line.

protocol.imap.imap_quota:
  type: boolean
  default: true
  helm: protocol.imap.imap_quota
  description: |
    Advertise and serve the QUOTA extension (RFC 9208). Independent of quota
    enforcement.

protocol.imap.imap_special_use_defaults:
  type: map
  default:
    Archive: \Archive
    Drafts: \Drafts
    Junk: \Junk
    Sent: \Sent
    Trash: \Trash
  helm: protocol.imap.imap_special_use_defaults
  description: |
    Folder name (case-sensitive) to its RFC 6154 attribute, e.g.
    `Sent: "\\Sent"`. A user's own `CREATE (USE …)` wins.

protocol.imap.imap_client_workarounds:
  type: list
  default: []
  values: [tb-extra-mailbox-sep, tb-lsub-flags]
  aliases: [client_workarounds]
  helm: protocol.imap.client_workarounds
  description: |
    Compatibility shims for clients that break the protocol.

protocol.pop3.pop3_no_flag_updates:
  type: boolean
  default: false
  helm: protocol.pop3.pop3_no_flag_updates
  description: |
    `false` sets `\Seen` on retrieved messages at QUIT. `true` changes no
    flags on retrieval.

protocol.pop3.pop3_reuse_xuidl:
  type: boolean
  default: false
  helm: protocol.pop3.pop3_reuse_xuidl
  description: |
    Use the `X-UIDL` message header as the UIDL value. Lets mail migrated
    from Courier, qmail or cPanel keep its UIDLs.

protocol.pop3.pop3_uidl_format:
  type: string
  default: "%u.%v"
  helm: protocol.pop3.pop3_uidl_format
  description: |
    UIDL format string; the variables are listed below.

protocol.pop3.pop3_uidl_duplicates:
  type: string
  default: rename
  values: [allow, rename]
  helm: protocol.pop3.pop3_uidl_duplicates
  description: |
    `allow` sends duplicate UIDLs as they are. `rename` appends a `-N`
    suffix so every UIDL is unique.

protocol.pop3.pop3_enable_last:
  type: boolean
  default: false
  helm: protocol.pop3.pop3_enable_last
  description: |
    Advertise and handle the `LAST` command (RFC 1460).

protocol.pop3.pop3_delete_type:
  type: string
  default: expunge
  values: [expunge, flag]
  helm: protocol.pop3.pop3_delete_type
  see_also: [protocol.pop3.pop3_deleted_flag]
  description: |
    `expunge` removes a deleted message from disk at QUIT. `flag` sets
    `pop3_deleted_flag` instead, so the message stays visible over IMAP.

protocol.pop3.pop3_deleted_flag:
  type: string
  default: ""
  helm: protocol.pop3.pop3_deleted_flag
  description: |
    IMAP flag set when `pop3_delete_type` is `flag`, for example
    `$POP3Deleted`.

protocol.pop3.pop3_save_uidl:
  type: boolean
  default: false
  helm: protocol.pop3.pop3_save_uidl
  description: |
    Persist computed UIDLs to a `pop3.uidl` file next to the folder's index.
    Later sessions load them, so UIDLs stay the same across index rebuilds
    and backend changes.

protocol.pop3.pop3_lock_session:
  type: boolean
  default: false
  helm: protocol.pop3.pop3_lock_session
  description: |
    Create a dotlock at `$HOME/yarilo-pop3-session.lock` after login, so
    another replica on the same PVC cannot serve the user at the same time.
    Locks older than 10 minutes are stolen.

protocol.jmap.jmap_base_url:
  type: string
  default: ""
  helm: protocol.jmap.jmap_base_url
  description: |
    Public origin clients reach this deployment on. Prefixes every URL in the
    session resource, so it must be the externally visible name, not a pod
    address.

protocol.jmap.jmap_max_concurrent_requests:
  type: integer
  default: 10
  helm: protocol.jmap.jmap_max_concurrent_requests
  description: |
    Simultaneous API calls per session.

protocol.jmap.jmap_max_calls_in_request:
  type: integer
  default: 16
  helm: protocol.jmap.jmap_max_calls_in_request
  description: |
    Method calls in one batch.

protocol.jmap.jmap_max_objects_in_get:
  type: integer
  default: 500
  helm: protocol.jmap.jmap_max_objects_in_get
  description: |
    Objects per `Foo/get`.

protocol.jmap.jmap_max_objects_in_set:
  type: integer
  default: 500
  helm: protocol.jmap.jmap_max_objects_in_set
  description: |
    Objects per `Foo/set`.

protocol.jmap.jmap_max_size_upload:
  type: string
  default: 40M
  helm: protocol.jmap.jmap_max_size_upload
  description: |
    One blob upload.

protocol.jmap.jmap_max_size_request:
  type: string
  default: 10M
  helm: protocol.jmap.jmap_max_size_request
  description: |
    One API request body.

protocol.jmap.jmap_max_body_value_bytes:
  type: string
  default: 256K
  helm: protocol.jmap.jmap_max_body_value_bytes
  description: |
    Server ceiling on one returned `Email` body value. A smaller client
    `maxBodyValueBytes` wins; truncated values are marked `isTruncated`.

protocol.jmap.jmap_query_max_limit:
  type: integer
  default: 256
  helm: protocol.jmap.jmap_query_max_limit
  description: |
    Server ceiling on ids returned by one query. A smaller client `limit`
    wins; the response reports the limit applied.

protocol.jmap.jmap_max_query_folders:
  type: integer
  default: 64
  helm: protocol.jmap.jmap_max_query_folders
  description: |
    Mailboxes one full-text `Email/query` may search. A query over more is
    refused, never answered from part of them.

protocol.jmap.jmap_snippet_max_chars:
  type: integer
  default: 256
  helm: protocol.jmap.jmap_snippet_max_chars
  description: |
    Visible characters in a `SearchSnippet` preview. Markup and HTML escapes
    are not counted; the subject is never cut.

protocol.jmap.jmap_upload_ttl:
  type: integer
  unit: seconds
  default: 3600
  helm: protocol.jmap.jmap_upload_ttl
  description: |
    How long an uploaded blob is kept for `Email/import` or `Email/set`.
    Uploading the same bytes again starts the clock again. `0` is refused at
    load.

protocol.jmap.jmap_submission_ttl_seconds:
  type: integer
  unit: seconds
  default: 86400
  helm: protocol.jmap.jmap_submission_ttl_seconds
  description: |
    How long a record of sent mail is kept for `EmailSubmission/get` and
    `/query`. `0` keeps none; mail is still sent. See [Records](#records).

protocol.jmap.jmap_push_poll:
  type: integer
  unit: seconds
  default: 60
  helm: protocol.jmap.jmap_push_poll
  description: |
    Interval between a push stream's looks for changes; `0` turns push off.
    See [Push](#push).

protocol.jmap.jmap_cors_allow_origins:
  type: list
  default: []
  helm: protocol.jmap.jmap_cors_allow_origins
  description: |
    Browser origins allowed to call the endpoint. Empty denies every
    cross-origin request. Exact match, scheme included.
